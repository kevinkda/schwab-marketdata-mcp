[project]
name = "schwab-marketdata-mcp"
version = "0.3.0"
description = "MCP server exposing 12 tools for Schwab Market Data Production API (10 endpoints + health_check + get_server_info)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "kevinkda" }]
keywords = ["mcp", "schwab", "market-data", "finance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "mcp>=1.6,<2.0",
    "schwab-py>=1.5.1,<1.6",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5.0,<8",
    "respx>=0.22.0,<0.24",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=3.7,<5",
    "detect-secrets>=1.5,<2",
]
windows = [
    # Windows native (Tier A best-effort).  plyer wraps win10toast / Windows
    # Runtime toast notifications behind a cross-platform API; the shim falls
    # back to PowerShell Windows.UI.Notifications when plyer is unavailable.
    # Tier B will add: pywin32>=306; platform_system == 'Windows'
    "plyer>=2.1,<3 ; platform_system == 'Windows'",
]

[project.scripts]
schwab-marketdata-mcp = "schwab_marketdata_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kevinkda/schwab-marketdata-mcp"
Issues = "https://github.com/kevinkda/schwab-marketdata-mcp/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schwab_marketdata_mcp"]

[tool.uv]
# uv resolves dev deps via [project.optional-dependencies].dev when called as
# `uv sync --extra dev` or `uv sync --all-extras`.
default-groups = []

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/schwab_marketdata_mcp",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "last: ensure this test runs after others (used by coverage assertion).",
    "posix_only: test depends on POSIX file-permission semantics; skipped on Windows.",
]
filterwarnings = [
    "error",
    # schwab-py / httpx may emit DeprecationWarnings out of our control
    "ignore::DeprecationWarning:schwab.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::DeprecationWarning:websockets.legacy.*",
]

# ---------------------------------------------------------------------------
# coverage (plan §6.4)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/schwab_marketdata_mcp"]
omit = [
    "src/schwab_marketdata_mcp/auth.py",
    "src/schwab_marketdata_mcp/__main__.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    "@(abc\\.)?abstractmethod",
]
fail_under = 85
show_missing = true
skip_covered = false

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
exclude = ["build", "dist", ".venv", "htmlcov"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "S",
    "RUF", "PL", "PIE", "PT", "RET", "TID", "ASYNC",
]
ignore = [
    "E501",      # line length handled by formatter
    "PLR0913",   # tool functions legitimately have many params (Schwab endpoints)
    "PLR2004",   # magic numbers in tests
    "S101",      # assert in tests
    "TID252",    # relative imports inside the package are intentional
    "PLC0415",   # local imports break circular deps in a few places
    "PT011",     # pytest.raises(Exception) is intentional in fuzzy tests
    "B017",      # `Exception` in pytest.raises matches PT011 cases
    "PT006",     # parametrize tuple style — both forms allowed
    "RET504",    # unnecessary assignment before return is fine for clarity
    "S311",      # random.random for jitter is non-crypto
    "PLW0603",   # global-statement usage is documented in the few places we use it
    "RUF012",    # mutable class attribute on Pydantic field
    "RUF059",    # unused unpacked vars are fine in `_, _, _ = ...`
    "ASYNC240",  # using pathlib in async tests is intentional
    "SIM105",    # contextlib.suppress not always clearer
    "SIM117",    # nested with for stdio_client / ClientSession is the documented MCP pattern
    "PT018",     # composite assertion in security/exception tests is intentional
    "PT019",     # `_isolate_xdg_state` is a documented pytest convention
    "PLR0911",   # exception class hierarchy returns
    "PLR0915",   # health.run is a long state machine — splitting hides the table structure
    "PLW0108",   # the lambda layer keeps mypy happy with the `Awaitable[dict]` callable type
    "S108",      # /tmp paths in tests
    "S103",      # 0o755 in fs hardening tests
    "S603",      # subprocess.run with argv list is fine
    "S105",      # tests use placeholder credentials
    "UP042",     # str-Enum compat
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "PLR0913"]
"src/schwab_marketdata_mcp/auth.py" = ["S603", "S605", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_unreachable = true
pretty = true
show_error_codes = true
exclude = ["build/", "dist/", ".venv/", "htmlcov/"]

[[tool.mypy.overrides]]
module = ["schwab.*", "mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plyer"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "build", ".venv"]
skips = ["B101"]  # assert is fine outside tests for invariant docs
