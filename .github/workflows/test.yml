name: test
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  ci:
    # V5-D: consume the shared reusable CI workflow (kevinkda/mcp-ci-templates).
    # secrets: inherit is required so the gitleaks step receives GITHUB_TOKEN.
    # The matrix (ubuntu + macos, py3.11/3.12) mirrors the previous inline
    # workflow exactly; the coverage gate (fail_under) stays pinned in this
    # repo's pyproject.toml, so no threshold is passed here.
    uses: kevinkda/mcp-ci-templates/.github/workflows/reusable-mcp-ci.yml@main
    secrets: inherit  # pragma: allowlist secret
    with:
      os-matrix: '["ubuntu-latest", "macos-latest"]'
      python-versions: '["3.11", "3.12"]'
      # Markdown is no longer linted by the local pre-commit hook (it was moved
      # to stages:[manual] because `npx --yes markdownlint-cli2` reinstalls the
      # Node dependency tree on every commit in locked-down dev environments and
      # is reaped by the pre-commit SIGTERM timeout).  Enable the markdownlint
      # job in CI so the docs are still authoritatively linted on a runner with
      # a warm Node cache.
      run-markdownlint: true
